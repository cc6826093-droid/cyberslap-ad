name: Render CyberSlap 3D Ad
on:
  workflow_dispatch:
    inputs:
      quality:
        description: Render quality
        type: choice
        options: [preview, hd]
        default: preview
      format:
        description: Aspect ratio
        type: choice
        options: [vertical, horizontal]
        default: vertical
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y blender ffmpeg libegl1 libgl1 libopengl0 libxrender1 libxkbcommon0
      - name: Render 3D frames
        env:
          QUALITY: ${{ inputs.quality }}
          FORMAT: ${{ inputs.format }}
        run: |
          mkdir -p /tmp/cyberslap_frames output
          if [ "$QUALITY" = hd ]; then SHORT=1080; else SHORT=360; fi
          if [ "$FORMAT" = horizontal ]; then export WIDTH=$((SHORT*16/9)) HEIGHT=$SHORT; else export WIDTH=$SHORT HEIGHT=$((SHORT*16/9)); fi
          blender -b -t 2 --python scene.py
      - name: Encode video and original audio
        run: |
          python3 soundtrack.py
          ffmpeg -hide_banner -loglevel error -y -framerate 24 -start_number 1 -i /tmp/cyberslap_frames/frame_%04d.png -i /tmp/cyberslap_audio.wav -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 21 -c:a aac -shortest -movflags +faststart output/cyberslap_ad.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: cyberslap-${{ inputs.quality }}-${{ inputs.format }}
          path: output/cyberslap_ad.mp4
          retention-days: 7
